<script id="docs-data" type="application/json">[{"file":"README.md","num":"00","title":"📘 DevAssistant — Documentación completa del proyecto","md":"# 📘 DevAssistant — Documentación completa del proyecto\n\n> 🖥️ **Versión interactiva:** abre [`index.html`](index.html) en el navegador (doble clic) para ver esta misma documentación con navegación lateral y diagramas renderizados.\n\n> **DevAssistant** es una **CLI conversacional** escrita en TypeScript que funciona como asistente técnico para desarrolladores. Combina tres técnicas:\n> 1. **Claude (Anthropic)** como cerebro del agente.\n> 2. **RAG** (Retrieval-Augmented Generation): indexa documentación Markdown en una base vectorial local (SQLite + `sqlite-vec`) usando **embeddings de OpenAI** y responde citando la fuente.\n> 3. **Function calling** (tool use): el modelo puede listar, leer y buscar archivos del proyecto, buscar en la documentación y crear issues en disco.\n\nEsta carpeta está pensada para que **cualquier persona (incluido tú en el futuro) entienda el proyecto completo sin leer el código primero**: qué hace, por qué, cómo está construido, para qué sirve cada archivo, cómo se usa y qué partes se pueden reutilizar.\n\n---\n\n## 🧭 ¿Por dónde empiezo?\n\n| Si quieres… | Lee |\n|---|---|\n| Entender **qué es** y **para qué sirve** en 5 minutos | [01 Visión](01-vision-negocio.md) → [02 Idea](02-idea-asistente.md) |\n| **Usarlo** ya mismo | [11 Guía de uso](11-guia-de-uso.md) → [07 Configuración](07-configuracion.md) |\n| Entender **cómo está construido** | [03 Arquitectura](03-arquitectura.md) → [04 Flujos](04-flujos.md) → [05 Modelo de datos](05-modelo-datos.md) |\n| Saber **qué hace cada archivo** | [09 Catálogo de archivos](09-catalogo-archivos.md) |\n| **Modificarlo / añadir una tool** | [06 Funciones y tools](06-funciones-tools.md) → [09 Catálogo](09-catalogo-archivos.md) |\n| **Copiar piezas** a otro proyecto | [12 Reutilizables](12-reutilizables.md) |\n| Revisar **bugs y deuda técnica** | [14 Problemas conocidos](14-problemas-conocidos.md) |\n| Un término que no conoces | [15 Glosario](15-glosario.md) |\n\n## 🗺️ Mapa del proyecto\n\n```mermaid\nmindmap\n  root((DevAssistant))\n    Negocio\n      Docs dispersas\n      Respuestas con fuente\n      Onboarding rápido\n    Interfaz\n      CLI readline\n      /ingest /stats /tools /clear /exit\n      Demo y code review\n    Agente\n      Claude API\n      Agentic loop\n      Máx 8 tool calls\n      Streaming\n    Tools\n      list_files\n      read_file\n      search_code\n      search_docs\n      create_issue\n    RAG\n      Chunker por ##\n      Embeddings OpenAI\n      SQLite + sqlite-vec\n      Top-K\n    Seguridad\n      Prompt injection\n      Sanitización\n      Rate limit\n      Sandbox de rutas\n```\n\n## 📑 Índice\n\n| # | Documento | Responde a |\n|---|---|---|\n| 01 | [Visión de negocio](01-vision-negocio.md) | ¿Qué problema resuelve, para quién y cómo medir el éxito? |\n| 02 | [Idea del asistente](02-idea-asistente.md) | ¿Qué hace el asistente, cómo se comporta y qué no hace? |\n| 03 | [Arquitectura](03-arquitectura.md) | ¿Cuáles son las piezas, capas y dependencias? |\n| 04 | [Flujos](04-flujos.md) | ¿Qué pasa paso a paso en cada operación? (diagramas de secuencia) |\n| 05 | [Modelo de datos](05-modelo-datos.md) | Interfaces, clases (UML) y esquema SQLite (ER) |\n| 06 | [Funciones y tools](06-funciones-tools.md) | Las 5 tools del agente, su esquema y cómo añadir una nueva |\n| 07 | [Configuración](07-configuracion.md) | Variables de entorno, comandos npm, comandos de la CLI, Codespaces |\n| 08 | [Roadmap](08-roadmap.md) | ¿Qué está hecho y qué falta? |\n| 09 | [Catálogo de archivos](09-catalogo-archivos.md) | **Ficha de cada archivo**: propósito, exports, dependencias, uso |\n| 10 | [Casos de uso](10-casos-de-uso.md) | Diagrama UML de casos de uso y especificación de cada uno |\n| 11 | [Guía de uso](11-guia-de-uso.md) | Tutorial paso a paso y solución de problemas |\n| 12 | [Reutilizables](12-reutilizables.md) | Qué módulos copiar a otros proyectos y cómo |\n| 13 | [Seguridad](13-seguridad.md) | Guardrails, sandbox de rutas y límites |\n| 14 | [Problemas conocidos](14-problemas-conocidos.md) | Bugs corregidos, deuda técnica resuelta y lo que queda pendiente |\n| 15 | [Glosario](15-glosario.md) | Términos: RAG, embedding, chunk, tool use… |\n\n## 🏷️ Leyenda de estados\n\n| Marca | Significado |\n|---|---|\n| ✅ Implementado | Existe y funciona en el código actual (`src/`) |\n| 🟡 Planeado | Idea o diseño, aún sin código |\n| ⚠️ Atención | Inconsistencia, limitación o deuda técnica a tener en cuenta |\n\n## 📦 Resumen técnico en una tabla\n\n| Aspecto | Valor |\n|---|---|\n| Lenguaje | TypeScript 5 (strict, ESM, `NodeNext`) ejecutado con `tsx` |\n| LLM del agente | Claude vía `@anthropic-ai/sdk` (modelo en `ANTHROPIC_MODEL`, por defecto `claude-sonnet-4-6`) |\n| Embeddings | OpenAI `text-embedding-3-small` (1536 dimensiones) vía `openai` |\n| Base vectorial | SQLite (`better-sqlite3`) + extensión `sqlite-vec` en `data/vectors.db` |\n| Interfaz | CLI interactiva (`readline`) |\n| Corpus de ejemplo | Docs ficticias de **TaskFlow API** en [`../sample-project/`](../sample-project/) (3 archivos → 30 chunks) |\n| Código fuente | 27 archivos `.ts` en `src/`, ~2.600 líneas |\n| Tests | `npm test`: 41 tests (`node:test` + `tsx`) en `tests/`, sin llamar a APIs. `npm run typecheck` revisa `src/` y `tests/`. No hay linter |\n\nDiagramas de referencia del curso (imágenes): [`../config-model/`](../config-model/).\n\n---\n\n## ♻️ Cómo reutilizar esta documentación como plantilla\n\n1. Copia `docs/proyecto/` al nuevo repositorio.\n2. Recorre los archivos en orden (01 → 15). Los documentos 01–08 terminan con un bloque **📝 Plantilla** con las preguntas que debes responder.\n3. Mantén los títulos de sección y el tipo de diagrama; reemplaza el contenido.\n4. El [catálogo de archivos](09-catalogo-archivos.md) usa una ficha fija por archivo: cópiala tal cual.\n5. Mantén la leyenda ✅/🟡/⚠️ para distinguir lo construido de lo planeado.\n\n## 🔄 Mantener `index.html` al día\n\nLos `.md` son la **fuente de verdad**. `index.html` se genera a partir de ellos (los incrusta y los renderiza con marked + mermaid desde CDN):\n\n```bash\nnode docs/proyecto/build-index.mjs\n```\n\nEjecútalo cada vez que edites un `.md` de esta carpeta. Para ver el HTML basta con hacer doble clic (necesita conexión a internet para cargar las librerías).\n\n> Los diagramas usan **Mermaid**: se renderizan en GitHub, GitLab, VS Code (extensión *Markdown Preview Mermaid Support*) y en `index.html`. Editor online: https://mermaid.live\n"},{"file":"01-vision-negocio.md","num":"01","title":"01 · Visión de negocio","md":"# 01 · Visión de negocio\n\n> **Propósito de esta sección:** explicar por qué existe el proyecto, a quién sirve y cómo sabremos que funciona.\n\n## 🎯 Problema\n\nEn los equipos de desarrollo la documentación técnica (READMEs, referencias de API, guías de instalación, decisiones de arquitectura) suele estar:\n\n- **Dispersa** en muchos archivos y repositorios.\n- **Desactualizada** o difícil de buscar con palabras clave exactas.\n- **Costosa de consultar**: los devs nuevos interrumpen a los senior con preguntas repetidas.\n\nAdemás, para entender **el código** hay que abrir muchos archivos y buscar dónde se usa cada cosa.\n\nResultado: onboarding lento, conocimiento concentrado en pocas personas y tiempo perdido buscando información.\n\n## 💡 Solución\n\n**DevAssistant**: un asistente conversacional de terminal que:\n\n1. **Lee la documentación** del proyecto (RAG) y responde en lenguaje natural **citando archivo y sección**.\n2. **Explora el código** por sí mismo (listar, leer y buscar archivos) para responder preguntas sobre el codebase.\n3. **Ejecuta acciones**: registra issues en `./issues/` y, como ejercicio aparte, hace **code review** de un archivo.\n\n```mermaid\nflowchart LR\n    P[\"😩 Problema<br/>Docs dispersas,<br/>preguntas repetidas\"] --> S[\"🤖 Solución<br/>Agente Claude<br/>+ RAG + tools\"]\n    S --> V1[\"⏱️ Menos tiempo<br/>buscando información\"]\n    S --> V2[\"🚀 Onboarding<br/>más rápido\"]\n    S --> V3[\"📎 Respuestas<br/>con fuente verificable\"]\n    S --> V4[\"🛠️ Acciones automáticas<br/>issues, code review\"]\n```\n\n## 👥 Usuarios (personas)\n\n| Persona | Necesidad | Cómo le ayuda DevAssistant |\n|---|---|---|\n| **Dev nuevo** (onboarding) | Entender rápido cómo instalar, configurar y usar la API | Responde \"¿cómo me autentico?\" con el fragmento exacto de la doc |\n| **Dev senior** | Dejar de responder las mismas preguntas | Delega preguntas frecuentes al asistente |\n| **Tech lead** | Mantener calidad y trazabilidad | Code review asistido y creación de issues estructurados |\n| **Estudiante del curso** | Aprender RAG, tool use y agentes con un proyecto real | Cada módulo implementa una técnica aislada y reutilizable |\n\n## 🧩 Casos de uso principales\n\nEspecificación completa (actores, flujos, pre/postcondiciones) en [10 · Casos de uso](10-casos-de-uso.md).\n\n| ID | Caso de uso | Cómo se usa | Estado |\n|---|---|---|---|\n| CU-01 | Conversar con el agente | `npm run dev` | ✅ |\n| CU-02 | Indexar documentación | `/ingest [ruta]` o `npm run ingest` | ✅ |\n| CU-03 | Preguntar sobre la documentación (RAG) | Pregunta en la CLI → tool `search_docs` | ✅ |\n| CU-04 | Explorar el código del proyecto | Pregunta en la CLI → tools `list_files` / `read_file` / `search_code` | ✅ |\n| CU-05 | Crear un issue | Pídeselo al agente → tool `create_issue` | ✅ |\n| CU-06 | Ver consumo y costo | `/stats` y al salir con `/exit` | ✅ |\n| CU-07 | Reiniciar la conversación | `/clear` | ✅ |\n| CU-08 | Code review de un archivo | `npm run review <archivo>` | ✅ |\n| CU-09 | Ver la demo automática | `npm run demo` | ✅ |\n| CU-10 | Probar los guardrails | `npx tsx src/security/examples.ts` | ✅ |\n| CU-11 | Listar las tools | `/tools` | ✅ |\n\nCorpus de ejemplo: documentación ficticia de **TaskFlow API** en [`../sample-project/`](../sample-project/).\n\n## 📈 Métricas de éxito\n\n| Métrica | Cómo se mide | Meta inicial |\n|---|---|---|\n| Precisión de respuestas | % de respuestas correctas en un set de preguntas de prueba | ≥ 80 % |\n| Respuestas con fuente | % de respuestas sobre docs que citan archivo y sección | 100 % |\n| Tiempo de respuesta | Latencia promedio por pregunta | < 10 s |\n| Costo por sesión | `/stats` (tokens × precio de `cost-calculator.ts`) | Monitoreado |\n| Seguridad | Intentos de prompt injection bloqueados (`security/examples.ts`) | 100 % de los casos de ejemplo |\n\n## 📦 Alcance\n\n**Dentro del alcance**\n- Asistente por línea de comandos (CLI).\n- Documentación en Markdown local (un directorio y sus subcarpetas).\n- Un solo LLM para el chat (Claude); OpenAI solo para embeddings.\n- Exploración de código **solo dentro del directorio del proyecto** (sandbox).\n- Issues locales como archivos Markdown.\n\n**Fuera del alcance (por ahora)**\n- Interfaz web / chat en Slack.\n- Autenticación de usuarios y multi-tenant.\n- Indexar fuentes remotas (Confluence, Notion, etc.).\n- Sincronizar issues con GitHub/Jira.\n- Memoria persistente entre sesiones.\n\n---\n\n> 📝 **Plantilla — preguntas a responder en tu proyecto**\n> 1. ¿Qué problema concreto existe hoy y quién lo sufre?\n> 2. ¿Cuál es la solución en una frase?\n> 3. ¿Quiénes son los 2–4 tipos de usuario y qué necesita cada uno?\n> 4. ¿Cuáles son los casos de uso principales y su estado?\n> 5. ¿Con qué métricas sabrás que funciona?\n> 6. ¿Qué queda explícitamente fuera del alcance?\n"},{"file":"02-idea-asistente.md","num":"02","title":"02 · Idea del asistente","md":"# 02 · Idea del asistente\n\n> **Propósito de esta sección:** describir el producto desde la perspectiva del usuario: qué sabe hacer, cómo se comporta y cuáles son sus límites.\n\n## 🤖 ¿Qué es DevAssistant?\n\nUn **agente conversacional de terminal** que combina tres técnicas:\n\n| Técnica | Para qué sirve en DevAssistant | Dónde vive |\n|---|---|---|\n| **LLM (Claude)** | Entender la pregunta, decidir qué herramienta usar y redactar la respuesta. Es el **único** LLM de chat; OpenAI solo genera embeddings | `src/agent/agent.ts`, `src/llm/` |\n| **RAG** (Retrieval-Augmented Generation) | Buscar los fragmentos relevantes de la documentación y dárselos al modelo como contexto para que no invente | `src/rag/` |\n| **Function calling** (tool use) | Permitir que el modelo pida ejecutar funciones reales: leer/buscar archivos, buscar en docs, crear issues | `src/tools/`, `src/agent/tool-registry.ts` |\n\nUn **agente** se diferencia de un chatbot en que **decide por sí mismo** qué acciones ejecutar, observa los resultados y vuelve a decidir, en un bucle (*agentic loop*), hasta tener la respuesta.\n\n## 🧠 Capacidades\n\n```mermaid\nflowchart TD\n    U([\"👤 Usuario\"]) -->|pregunta| G[\"🛡️ Guardrails<br/>sanitizar + injection + rate limit\"]\n    G -->|bloqueado| U\n    G -->|ok| A{\"🤖 Claude decide\"}\n    A -->|\"pregunta sobre docs\"| T1[\"🔎 search_docs<br/>(RAG)\"]\n    A -->|\"pregunta sobre código\"| T2[\"📂 list_files<br/>📄 read_file<br/>🔍 search_code\"]\n    A -->|\"registrar algo\"| T3[\"📝 create_issue\"]\n    A -->|\"puede responder\"| R[\"💬 Respuesta en streaming\"]\n    T1 & T2 & T3 -->|resultado de la tool| A\n    R --> U\n```\n\n| Capacidad | Descripción | Estado |\n|---|---|---|\n| Q&A sobre documentación | `search_docs` recupera los chunks más parecidos de la base vectorial | ✅ |\n| Citar fuentes | Cada fragmento llega al modelo como `[FUENTE: archivo \\| Sección: … \\| Relevancia: …%]`, y el system prompt le pide citarlo | ✅ |\n| Explorar código | `list_files`, `read_file`, `search_code` (solo dentro del proyecto) | ✅ |\n| Encadenar herramientas | Hasta **8 tool calls por turno**, varias en paralelo | ✅ |\n| Crear issues | Escribe `issues/issue-NNN.md` con metadata | ✅ |\n| Respuesta en streaming | El texto aparece en tiempo real en la terminal (una sola llamada por paso del loop) | ✅ |\n| Memoria de la conversación | El historial se mantiene durante la sesión (`/clear` lo borra) | ✅ |\n| Reporte de consumo | `/stats`: turnos, tokens de Claude y de embeddings, y costo estimado en USD | ✅ |\n| Code review | Script aparte `npm run review <archivo>` | ✅ |\n| Guardrails | Bloquea prompt injection (EN/ES) y exceso de peticiones | ✅ |\n| Proteger secretos | `read_file` no puede leer `.env`; el sandbox resuelve symlinks | ✅ |\n\n## 💬 Ejemplo de conversación real\n\n```text\nTú: /ingest\nIniciando ingestión desde: ./docs/sample-project\nProcesando api-reference.md... 11 chunks generados\nProcesando getting-started.md... 7 chunks generados\nProcesando README.md... 12 chunks generados\nGenerando embeddings para 30 chunks...\n30 chunks almacenados en ./data/vectors.db\nVector store actualizado — listo para búsquedas\n\nTú: ¿Cómo me autentico en la API de TaskFlow?\nAgente procesando turno 1...\nEjecutando tool: search_docs ({\"query\":\"autenticación API TaskFlow\"} [1/8])\nBuscando: \"autenticación API TaskFlow\" -> 5 chunks recuperados\nHerramienta completada: search_docs\nDevAssistant: TaskFlow usa **JWT**. Haz `POST /auth/login` con email y password…\n📎 Fuente: api-reference.md › ## Autenticación\n\nHerramientas utilizadas: search_docs\n\nTú: Crea un issue para documentar mejor el refresh token, prioridad alta\nEjecutando tool: create_issue (...)\nDevAssistant: ✅ Issue creado: issues/issue-001.md\n```\n\n## 🎭 Personalidad y reglas (system prompt real)\n\nEl system prompt está en [`src/agent/system-prompt.ts`](../../src/agent/system-prompt.ts) (`AGENT_SYSTEM_PROMPT`). Resumen:\n\n- **Rol:** agente de asistencia técnica especializado en documentación y análisis de código.\n- **Conoce sus 5 tools** y tiene **reglas de decisión** explícitas:\n  - Preguntas \"¿cómo…?\", \"¿qué es…?\" → `search_docs` (siempre antes de decir que no sabe).\n  - \"¿Dónde se usa X?\" → `search_code`; \"lee este archivo\" → `read_file`; si no conoce la estructura → `list_files` primero.\n  - Solo crea issues si el usuario lo pide explícitamente.\n- **Formato:** Markdown, conciso, cita archivo y sección, incluye rutas de código.\n- **Límites:** máximo 8 tool calls por turno, solo archivos del proyecto, sin internet, issues solo locales.\n\n## 🚧 Limitaciones conocidas\n\n- Solo conoce lo que está indexado; si la doc está desactualizada, la respuesta también. Hay que repetir `/ingest` tras cambiar los `.md`.\n- Cada `/ingest` **reemplaza** el índice: solo hay una colección de documentos a la vez.\n- La calidad depende del *chunking* (división por `## `, máx. 2000 caracteres) y de `RAG_TOP_K`.\n- Cada respuesta cuesta tokens; las preguntas muy amplias usan más contexto (cada paso del loop reenvía el historial completo).\n- Sin memoria persistente entre sesiones.\n- Los guardrails se basan en **expresiones regulares**: son una primera barrera, no una garantía.\n\n---\n\n> 📝 **Plantilla — preguntas a responder en tu proyecto**\n> 1. ¿Qué es el producto en una frase y qué técnicas usa?\n> 2. ¿Cuáles son sus capacidades y en qué estado está cada una?\n> 3. ¿Cómo se ve una interacción típica (ejemplo real)?\n> 4. ¿Qué reglas de comportamiento debe respetar siempre?\n> 5. ¿Cuáles son sus límites conocidos?\n"},{"file":"03-arquitectura.md","num":"03","title":"03 · Arquitectura","md":"# 03 · Arquitectura\n\n> **Propósito de esta sección:** mostrar las piezas del sistema, cómo se agrupan en capas y cómo dependen unas de otras.\n\n## 🏗️ Diagrama de componentes\n\n```mermaid\nflowchart TB\n    subgraph USER[\"👤 Usuario\"]\n        TERM[\"Terminal\"]\n    end\n\n    subgraph ENTRY[\"Puntos de entrada (npm scripts)\"]\n        IDX[\"src/index.ts<br/>npm run dev / start\"]\n        ING[\"src/rag/ingest.ts<br/>npm run ingest\"]\n        DEMO[\"src/agent/demo.ts<br/>npm run demo\"]\n        REV[\"src/exercises/code-reviewer.ts<br/>npm run review\"]\n        SEC_EX[\"src/security/examples.ts<br/>npx tsx\"]\n    end\n\n    subgraph UI[\"Capa de interfaz\"]\n        CLI[\"chat/cli.ts<br/>startCLI · comandos /\"]\n    end\n\n    subgraph SEC[\"Capa de seguridad\"]\n        GR[\"security/guardrails.ts<br/>sanitize · injection · RateLimiter\"]\n    end\n\n    subgraph AGENT[\"Capa de agente\"]\n        AG[\"agent/agent.ts<br/>DevAssistantAgent\"]\n        SP[\"agent/system-prompt.ts\"]\n        REG[\"agent/tool-registry.ts<br/>ALL_TOOL_DEFINITIONS · executeAnyTool\"]\n    end\n\n    subgraph TOOLS[\"Capa de tools\"]\n        DEF[\"tools/definitions.ts\"]\n        EXE[\"tools/executor.ts<br/>sandbox de rutas\"]\n    end\n\n    subgraph RAG[\"Capa RAG\"]\n        IDXR[\"rag/indexer.ts<br/>indexDocuments\"]\n        CH[\"rag/chunker.ts\"]\n        EM[\"rag/embeddings.ts\"]\n        VS[\"rag/vector-store.ts\"]\n        RET[\"rag/retriever.ts<br/>singleton\"]\n    end\n\n    subgraph LLM[\"Capa LLM\"]\n        AC[\"llm/anthropic-client.ts<br/>client compartido\"]\n        ST[\"llm/streaming.ts\"]\n        PR[\"llm/prompts.ts\"]\n    end\n\n    subgraph CROSS[\"Transversal\"]\n        CFG[\"config.ts\"]\n        IFACE[\"interface.ts · types.ts\"]\n        COST[\"utils/cost-calculator.ts\"]\n    end\n\n    subgraph EXT[\"Servicios / recursos externos\"]\n        CLAUDE[(\"☁️ Anthropic API\")]\n        OPENAI[(\"☁️ OpenAI Embeddings\")]\n        DB[(\"🗄️ data/vectors.db\")]\n        FS[(\"📁 Archivos del proyecto\")]\n        ISS[(\"📝 issues/\")]\n    end\n\n    TERM --> IDX --> CLI\n    CLI --> GR\n    CLI --> AG\n    CLI --> COST\n    CLI -->|/ingest| IDXR\n    IDXR --> CH & EM & VS\n    IDXR -->|resetStore| RET\n    AG --> SP & REG & AC\n    REG --> DEF & EXE\n    REG -->|search_docs| RET\n    REG -->|create_issue| ISS\n    EXE --> FS\n    RET --> EM & VS\n    EM --> OPENAI\n    VS --> DB\n    AC --> CLAUDE\n    ING --> IDXR\n    DEMO --> AG\n    REV --> ST & PR\n    ST --> AC\n    SEC_EX --> GR\n```\n\n## 🧱 Capas y responsabilidades\n\n| Capa | Archivos | Responsabilidad | Depende de |\n|---|---|---|---|\n| **Entrada** | `index.ts`, `rag/ingest.ts`, `agent/demo.ts`, `exercises/code-reviewer.ts`, `security/examples.ts` | Arrancar un programa concreto (cada uno es un \"main\") | Las capas inferiores |\n| **Interfaz** | `chat/cli.ts` | Leer la entrada, enrutar comandos `/`, imprimir respuestas y estadísticas | Seguridad, Agente, RAG, Utils |\n| **Seguridad** | `security/guardrails.ts` | Sanitizar texto, detectar prompt injection, limitar peticiones | — (sin dependencias) |\n| **Agente** | `agent/agent.ts`, `agent/system-prompt.ts`, `agent/tool-registry.ts` | Agentic loop con Claude; registro y despacho de las 5 tools | LLM, Tools, RAG |\n| **Tools** | `tools/definitions.ts`, `tools/executor.ts` | Esquemas JSON de las tools de archivos y su ejecución segura | Sistema de archivos |\n| **RAG** | `rag/indexer.ts`, `rag/chunker.ts`, `rag/embeddings.ts`, `rag/vector-store.ts`, `rag/retriever.ts`, `rag/rag-chain.ts` | Pipeline de ingesta, dividir docs, generar embeddings, almacenar y buscar vectores | OpenAI, SQLite, (LLM para `rag-chain`) |\n| **LLM** | `llm/anthropic-client.ts`, `llm/streaming.ts`, `llm/prompts.ts` | Cliente único de Anthropic, helpers de llamada/streaming, prompts | Anthropic API |\n| **Transversal** | `config.ts`, `interface.ts`, `types.ts`, `utils/cost-calculator.ts` | Configuración, tipos compartidos, cálculo de costos | `.env` |\n\nMódulos **históricos del curso** que siguen en el código pero que la CLI no usa (útiles como ejemplo o para reutilizar): `chat/conversation.ts` (chat simple sin tools), `tools/agent-loop.ts` (loop de tools mínimo), `rag/rag-chain.ts` (RAG directo sin agente), `llm/anthropic-client.ts#askClaude`.\n\n## 🔗 Grafo de dependencias entre módulos (imports)\n\n```mermaid\nflowchart LR\n    index --> config\n    index --> cli\n    cli --> indexer & embeddings & agent & toolRegistry & guardrails & costCalc & config\n    indexer --> config & chunker & embeddings & vectorStore & retriever\n    agent --> systemPrompt & toolRegistry & anthropicClient & config\n    toolRegistry --> retriever & definitions & executor\n    retriever --> config & embeddings & vectorStore\n    ingest --> config & indexer\n    ragChain --> streaming & retriever\n    streaming --> config & anthropicClient\n    anthropicClient --> config\n    embeddings --> config\n    conversation --> config & anthropicClient\n    agentLoop --> definitions & anthropicClient & config & executor\n    demo --> agent\n    codeReviewer --> streaming & prompts\n    examples --> guardrails\n\n    index[\"index.ts\"]\n    cli[\"chat/cli.ts\"]\n    agent[\"agent/agent.ts\"]\n    systemPrompt[\"agent/system-prompt.ts\"]\n    toolRegistry[\"agent/tool-registry.ts\"]\n    demo[\"agent/demo.ts\"]\n    definitions[\"tools/definitions.ts\"]\n    executor[\"tools/executor.ts\"]\n    agentLoop[\"tools/agent-loop.ts\"]\n    chunker[\"rag/chunker.ts\"]\n    embeddings[\"rag/embeddings.ts\"]\n    vectorStore[\"rag/vector-store.ts\"]\n    retriever[\"rag/retriever.ts\"]\n    ragChain[\"rag/rag-chain.ts\"]\n    ingest[\"rag/ingest.ts\"]\n    indexer[\"rag/indexer.ts\"]\n    anthropicClient[\"llm/anthropic-client.ts\"]\n    streaming[\"llm/streaming.ts\"]\n    prompts[\"llm/prompts.ts\"]\n    conversation[\"chat/conversation.ts\"]\n    guardrails[\"security/guardrails.ts\"]\n    examples[\"security/examples.ts\"]\n    costCalc[\"utils/cost-calculator.ts\"]\n    codeReviewer[\"exercises/code-reviewer.ts\"]\n    config[\"config.ts\"]\n```\n\n> `interface.ts` y `types.ts` se importan desde casi todos los módulos; se omiten del grafo para que sea legible.\n\n## 🧩 Decisiones de diseño clave\n\n| Decisión | Por qué | Consecuencia |\n|---|---|---|\n| **Un solo cliente de Anthropic** exportado desde `llm/anthropic-client.ts` | Reutilizar conexión y configuración | Todos los módulos importan `client` de ahí |\n| **Embeddings con OpenAI, chat con Claude** | Anthropic no ofrece API de embeddings propia | Se necesitan **dos API keys** para el flujo completo |\n| **SQLite + `sqlite-vec`** como base vectorial | Cero infraestructura: un archivo local | La dimensión del vector se fija al crear la tabla y se guarda en `meta`; cambiar de modelo exige re-ingestar |\n| **Store del retriever como singleton** | No reabrir la BD en cada búsqueda | `indexDocuments()` llama a `resetStore()` antes de reescribir la base |\n| **Una sola implementación de la ingesta** (`rag/indexer.ts`) | La CLI y el script no deben divergir | `ingest.ts` es solo un envoltorio de línea de comandos |\n| **Streaming dentro del loop** (`messages.stream` + `finalMessage()`) | Ver el texto en tiempo real sin pagar una llamada extra | El texto que Claude escribe antes de pedir una tool también se muestra |\n| **Tools que devuelven `string`** (también en error) | El modelo puede leer el error y corregirse | Los errores de tools nunca lanzan excepción al loop |\n| **Sandbox de rutas** con `process.cwd()` + `realpath` + bloqueo de `.env` | Impedir que el modelo lea fuera del proyecto o lea secretos | Hay que ejecutar la CLI **desde la raíz del proyecto** |\n| **Límite de 8 tool calls por turno** | Evitar bucles infinitos y costos descontrolados | Tareas grandes deben dividirse |\n| **Guardrails antes del agente** | Rechazar entradas maliciosas sin gastar tokens | Los comandos `/` no pasan por guardrails |\n\n## 🔀 Proveedores\n\n| Proveedor | Para qué | Dónde |\n|---|---|---|\n| **Anthropic (Claude)** | Todo el chat: agente, streaming, code review, `Conversation`, `askWithRAG` | `llm/anthropic-client.ts` |\n| **OpenAI** | **Solo** embeddings (ingesta y `search_docs`) | `rag/embeddings.ts` |\n\nAntes existían las variables `MODEL_PROVIDER` y `OPENAI_MODEL`, pero ningún flujo las usaba; se **eliminaron** para que la configuración refleje lo que el código hace de verdad. Si en el futuro se quiere OpenAI como LLM del chat, el punto de extensión natural es un `llm/openai-client.ts` más una capa que traduzca el formato de tools y mensajes (`tool_use`/`tool_result` de Anthropic ↔ `tool_calls` de OpenAI).\n\n## 🧰 Stack tecnológico\n\n| Paquete | Versión | Uso |\n|---|---|---|\n| `typescript` | ^5.9 | Lenguaje y `tsc` (typecheck/build) |\n| `tsx` | ^4.21 | Ejecuta `.ts` directamente sin compilar |\n| `@anthropic-ai/sdk` | ^0.80 | Llamadas a Claude (`messages.create`, `messages.stream`) |\n| `openai` | ^6.32 | Embeddings (`embeddings.create`) |\n| `better-sqlite3` | ^13.2 | Driver SQLite síncrono |\n| `sqlite-vec` | ^0.1.9 | Extensión de búsqueda vectorial (`vec0`, `MATCH`, `k`) |\n| `dotenv` | ^17.3 | Carga `.env` en `process.env` |\n| `node:test` (nativo) | — | Runner de tests, ejecutado con `tsx --test` (sin dependencias extra) |\n| `@types/node`, `@types/better-sqlite3` | dev | Tipos |\n\n## 📁 Estructura de carpetas\n\n```text\nDEV-ASSITANT/\n├── src/                      # Código fuente (ver 09-catalogo-archivos.md)\n│   ├── index.ts              # Entry point de la CLI\n│   ├── config.ts             # Configuración desde .env\n│   ├── interface.ts          # Interfaces compartidas\n│   ├── types.ts              # Tipos unión compartidos\n│   ├── agent/                # Agente, system prompt, registro de tools, demo\n│   ├── chat/                 # CLI interactiva + clase Conversation (histórica)\n│   ├── exercises/            # Ejercicio: code reviewer\n│   ├── llm/                  # Cliente Anthropic, streaming, prompts\n│   ├── rag/                  # Indexer, chunking, embeddings, vector store, retriever, ingest\n│   ├── security/             # Guardrails y ejemplos\n│   ├── tools/                # Tools de archivos: definiciones, executor, loop simple\n│   └── utils/                # Calculadora de costos\n├── tests/                    # Tests (node:test) + tsconfig.json para su typecheck\n├── docs/\n│   ├── proyecto/             # ← Esta documentación\n│   ├── sample-project/       # Corpus RAG de ejemplo (TaskFlow API)\n│   └── config-model/         # Diagramas de referencia (PNG)\n├── data/                     # vectors.db (+ -wal/-shm) y chunks-preview.json  [generado, gitignored]\n├── issues/                   # Issues creados por el agente                     [generado, gitignored]\n├── .devcontainer/            # devcontainer.json para GitHub Codespaces\n├── .github/codespaces/       # post-create.sh (lo ejecuta el devcontainer)\n├── .env / .env.template      # Variables de entorno\n├── package.json · tsconfig.json\n├── README.md                 # README general del repositorio\n└── CLAUDE.md                 # Guía para Claude Code\n```\n\n---\n\n> 📝 **Plantilla — preguntas a responder en tu proyecto**\n> 1. ¿Cuáles son los componentes y cómo se agrupan en capas?\n> 2. ¿Qué depende de qué (grafo de imports)?\n> 3. ¿Qué decisiones de diseño se tomaron y por qué?\n> 4. ¿Qué stack se usa y para qué sirve cada dependencia?\n> 5. ¿Cómo está organizada la estructura de carpetas?\n"},{"file":"04-flujos.md","num":"04","title":"04 · Flujos","md":"# 04 · Flujos\n\n> **Propósito de esta sección:** describir paso a paso qué ocurre en cada operación, con diagramas de secuencia y de actividad.\n\nÍndice:\n1. [Arranque de la CLI](#1-arranque-de-la-cli-)\n2. [Bucle de la CLI y enrutado de comandos](#2-bucle-de-la-cli-y-enrutado-de-comandos-)\n3. [Ingesta de documentación (`/ingest` y `npm run ingest`)](#3-ingesta-de-documentación-)\n4. [Un turno del agente (agentic loop)](#4-un-turno-del-agente-agentic-loop-)\n5. [Tool `search_docs` (consulta RAG)](#5-tool-search_docs-consulta-rag-)\n6. [Tools de archivos con sandbox](#6-tools-de-archivos-con-sandbox-)\n7. [Tool `create_issue`](#7-tool-create_issue-)\n8. [Code review (`npm run review`)](#8-code-review-npm-run-review-)\n9. [Demo automática (`npm run demo`)](#9-demo-automática-npm-run-demo-)\n10. [RAG directo sin agente (`askWithRAG`)](#10-rag-directo-sin-agente-askwithrag-)\n\n---\n\n## 1. Arranque de la CLI ✅\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Dev as 👤 Desarrollador\n    participant NPM as npm run dev\n    participant IDX as index.ts\n    participant CFG as config.ts\n    participant ENV as .env\n    participant CLI as chat/cli.ts\n\n    Dev->>NPM: npm run dev\n    NPM->>IDX: tsx src/index.ts\n    IDX->>CFG: import (se evalúa el módulo)\n    CFG->>ENV: dotenv.config()\n    ENV-->>CFG: process.env\n    CFG->>CFG: dimensiones del embedding (modelo o EMBEDDING_DIMENSIONS)\n    CFG-->>IDX: config\n    IDX->>CFG: validateConfig()\n    alt falta ANTHROPIC_API_KEY\n        CFG-->>IDX: throw Error\n        IDX-->>Dev: \" Error: ANTHROPIC_API_KEY está vacía…\" y exit(1)\n    else falta OPENAI_API_KEY\n        CFG-->>Dev: warning (RAG no funcionará), continúa\n    end\n    IDX->>CLI: startCLI()\n    CLI->>CLI: new DevAssistantAgent(), createRateLimiter()\n    CLI-->>Dev: banner + \"Tú: \"\n```\n\n> Importante: al **importar** `config.ts`, `llm/anthropic-client.ts` y `rag/embeddings.ts` se crean los clientes de Anthropic y OpenAI con las keys del `.env` (efecto secundario de import).\n\n## 2. Bucle de la CLI y enrutado de comandos ✅\n\n`startCLI()` lee las líneas con `for await (const line of rl)` y delega cada una en `handleInput()`. Mientras el agente responde, las líneas nuevas esperan en cola.\n\n```mermaid\nflowchart TD\n    A[\"for await (line of rl)<br/>prompt 'Tú: '\"] --> B{\"input vacío?\"}\n    B -->|sí| A\n    B -->|no| C{\"handleInput: ¿qué es?\"}\n    C -->|/stats| S[\"getStats() + tokens de embeddings<br/>costo chat + embeddings\"] --> A\n    C -->|/exit o /salida| X[\"Resumen final + break\"] --> FIN([\"rl.close()\"])\n    C -->|/clear o /limpiar| L[\"agent.clearHistory()<br/>(los tokens de la sesión se conservan)\"] --> A\n    C -->|/tools| T[\"Lista ALL_TOOL_DEFINITIONS<br/>nombre(params) + 1ª frase\"] --> A\n    C -->|\"/ingest ruta\"| I[\"indexDocuments(ruta ?? DOCS_PATH)\"] --> A\n    C -->|texto libre| G[\"checkGuardrails(input, rateLimiter)\"]\n    G -->|safe = false| M[\"Imprime reason\"] --> A\n    G -->|safe = true| AG[\"agent.chat(sanitized, onChunk)<br/>streaming a stdout\"]\n    AG --> H[\"Imprime 'Herramientas utilizadas'\"] --> A\n    AG -->|excepción| E[\"console.error\"] --> A\n```\n\n## 3. Ingesta de documentación ✅\n\nUna sola implementación: `indexDocuments()` en `rag/indexer.ts`, usada por el comando `/ingest` de la CLI y por `npm run ingest` (`rag/ingest.ts`, que además pide escribir `data/chunks-preview.json`).\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Dev as 👤 Desarrollador\n    participant CLI as cli.ts / ingest.ts\n    participant IX as rag/indexer.ts\n    participant CH as rag/chunker.ts\n    participant FS as 📁 docs/**/*.md\n    participant EM as rag/embeddings.ts\n    participant OAI as ☁️ OpenAI\n    participant RET as rag/retriever.ts\n    participant VS as rag/vector-store.ts\n    participant DB as 🗄️ vectors.db\n\n    Dev->>CLI: /ingest ./docs/sample-project\n    CLI->>IX: indexDocuments(ruta)\n    IX->>CH: processDirectory(ruta)\n    CH->>FS: recorre subcarpetas (omite ocultas y node_modules)\n    loop por cada .md (orden por ruta relativa)\n        CH->>FS: readFile(utf-8)\n        CH->>CH: chunkMarkdown(contenido, ruta relativa)\n    end\n    CH-->>IX: Chunk[] (p.ej. 30)\n    alt 0 chunks\n        IX-->>Dev: \"No se encontraron archivos .md (no se modificó el índice)\"\n    end\n    loop lotes de 100 textos\n        IX->>EM: generateEmbeddings\n        EM->>OAI: embeddings.create(lote)\n        OAI-->>EM: vectores (+ usage tokens)\n    end\n    IX->>IX: ¿dimensión = config.embeddingDimensions? si no, error\n    IX->>RET: resetStore() (cierra el singleton)\n    IX->>VS: new VectorStore(DB_PATH, dimensiones)\n    IX->>VS: clear() — borra todo y recrea la tabla vec0 con la dimensión actual\n    IX->>VS: insertMany(chunks, vectores) — una transacción\n    VS->>DB: INSERT en chunks y chunk_embeddings\n    IX->>VS: close()\n    IX-->>Dev: \"N chunks de M archivos almacenados…\"\n```\n\n### Algoritmo de chunking (`chunkMarkdown`)\n\n```mermaid\nflowchart TD\n    A[\"Contenido .md\"] --> B[\"Normalizar CRLF → LF\"]\n    B --> C[\"Dividir antes de cada línea '## '<br/>(regex /(?=^## )/m)\"]\n    C --> D{\"¿sección ≤ 2000 chars?\"}\n    D -->|sí| E[\"1 chunk = último párrafo del chunk anterior (solapamiento)<br/>+ sección completa\"]\n    D -->|no| F[\"Quitar la línea de encabezado<br/>dividir el cuerpo en párrafos (\\\\n\\\\n)\"]\n    F --> G[\"Acumular párrafos hasta superar 2000 chars\"]\n    G --> H[\"Emitir chunk = '## Encabezado' + párrafos<br/>el siguiente empieza con el último párrafo (solapamiento)\"]\n    H --> G\n    E --> I[\"id = rutaRelativa-posición (p.ej. guias/README.md-2)<br/>metadata: source, heading, position, charCount\"]\n    H --> I\n```\n\n- El texto antes del primer `## ` se etiqueta como `heading: \"(Introducción)\"`.\n- El solapamiento de **un párrafo** entre chunks consecutivos mantiene el contexto entre fragmentos.\n- Los encabezados `###` no dividen; quedan dentro del chunk de su `##`.\n- `source` es la ruta relativa al directorio ingestado, con `/` como separador; así dos `README.md` en carpetas distintas no colisionan.\n\n## 4. Un turno del agente (agentic loop) ✅\n\n`DevAssistantAgent.chat(userMessage, onChunk?)` en `src/agent/agent.ts`. Cada iteración hace **una sola llamada** a través de `callModel()`: con `onChunk` usa `messages.stream` (el texto se emite en tiempo real) y `finalMessage()` para leer `stop_reason` y `usage`; sin `onChunk` usa `messages.create`.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant CLI as cli.ts\n    participant AG as DevAssistantAgent\n    participant API as ☁️ Claude (stream o create)\n    participant REG as tool-registry.ts\n\n    CLI->>AG: chat(texto, onChunk)\n    AG->>AG: turns++, toolCallsLastTurn = 0<br/>messages.push({user, texto})\n    loop mientras toolCallsLastTurn < 8\n        AG->>API: callModel: model, system, tools[5], messages\n        API-->>CLI: onChunk(fragmento) … texto en tiempo real\n        API-->>AG: finalMessage (stop_reason + usage)\n        AG->>AG: suma tokens del turno y de la sesión\n        alt stop_reason = \"tool_use\"\n            AG->>AG: ¿toolCalls + nuevas > 8? → mensaje de límite y return\n            AG->>AG: messages.push({assistant, content con tool_use})\n            par cada bloque tool_use (en paralelo)\n                AG->>REG: executeAnyTool(name, input)\n                REG-->>AG: string (resultado o error)\n            end\n            AG->>AG: messages.push({user, tool_result[]})\n        else stop_reason = \"end_turn\"\n            AG->>AG: messages.push({assistant, texto})\n            AG-->>CLI: AgentResponse {text, toolsUsed, tokens}\n        else otro stop_reason (max_tokens, etc.)\n            AG-->>CLI: texto disponible o \"Sesión terminada inesperadamente\"\n        end\n    end\n```\n\n### Estados del loop\n\n```mermaid\nstateDiagram-v2\n    [*] --> LlamandoClaude: chat(mensaje)\n    LlamandoClaude --> EjecutandoTools: stop_reason = tool_use\n    EjecutandoTools --> LlamandoClaude: tool_result añadido\n    EjecutandoTools --> LimiteAlcanzado: > 8 tool calls\n    LlamandoClaude --> Respondido: end_turn (texto ya emitido en streaming)\n    LlamandoClaude --> Inesperado: max_tokens / otro\n    Respondido --> [*]\n    LimiteAlcanzado --> [*]\n    Inesperado --> [*]\n```\n\n**Historial de mensajes** tras un turno con una tool:\n\n```text\n[user]      \"¿Cómo me autentico?\"\n[assistant] [text?, tool_use{id: toolu_1, name: search_docs, input:{query}}]\n[user]      [tool_result{tool_use_id: toolu_1, content: \"Se encontraron 5 fragmentos…\"}]\n[assistant] \"TaskFlow usa JWT…\"          ← texto final (de la misma llamada en streaming)\n```\n\n## 5. Tool `search_docs` (consulta RAG) ✅\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant REG as tool-registry.ts\n    participant RET as retriever.ts\n    participant VS as VectorStore (singleton)\n    participant EM as embeddings.ts\n    participant OAI as ☁️ OpenAI\n    participant DB as 🗄️ vectors.db\n\n    REG->>RET: retrieveContext(query, min(top_k ?? 5, 10))\n    RET->>VS: getStore() (lo crea la 1ª vez)\n    RET->>VS: size\n    alt store vacío\n        RET-->>REG: [] → \"No se encontraron documentos… usa /ingest\"\n    else hay chunks\n        RET->>EM: generateEmbedding(query)\n        EM->>OAI: embeddings.create(query)\n        OAI-->>EM: number[dimensiones]\n        RET->>VS: search(vector, topK) — error claro si la dimensión no coincide con la base\n        VS->>DB: SELECT … WHERE embedding MATCH ? AND k = ? ORDER BY distance\n        DB-->>VS: filas + distance\n        VS-->>RET: SearchResult[] (score = 1 − distance/2)\n        RET-->>REG: RetrievedChunk[]\n        REG-->>REG: formatea \"[FUENTE: x | Sección: y | Relevancia: z%]\\ncontenido\" unidos por ---\n    end\n```\n\n## 6. Tools de archivos con sandbox ✅\n\n```mermaid\nflowchart TD\n    A[\"executeTool(name, params)\"] --> V{\"¿params válidos?<br/>(typeof string)\"}\n    V -->|no| ERR1[\"'Error: el parámetro … es requerido'\"]\n    V -->|sí| R[\"resolveSecurePath(ruta)<br/>path.resolve(cwd, ruta)\"]\n    R --> S{\"¿dentro de cwd?\"}\n    S -->|no| ERR2[\"'Error de seguridad: … fuera del proyecto'\"]\n    S -->|sí| RP{\"¿existe?\"}\n    RP -->|no| T\n    RP -->|sí| RR{\"realpath (resuelve symlinks)<br/>¿sigue dentro de cwd?\"}\n    RR -->|no| ERR2\n    RR -->|sí| T{\"tool\"}\n    T -->|list_files| LF[\"collectFiles recursivo<br/>omite node_modules, .ocultos y symlinks<br/>filtro por extensión\"]\n    T -->|read_file| SEC{\"¿.env / .env.local…?\"}\n    SEC -->|sí| ERR3[\"'Error de seguridad: contiene secretos'\"]\n    SEC -->|no| RF[\"stat → si > 50.000 bytes: error<br/>si no: contenido completo\"]\n    T -->|search_code| SC[\"collectFiles + includes(pattern)<br/>máx 20 coincidencias, ±2 líneas de contexto\"]\n```\n\n## 7. Tool `create_issue` ✅\n\n```mermaid\nsequenceDiagram\n    participant AG as Agente\n    participant REG as tool-registry.ts\n    participant FS as 📁 ./issues/\n    AG->>REG: create_issue {title, description, labels?, priority?}\n    REG->>FS: mkdir ./issues (recursive)\n    REG->>FS: readdir → números de los issue-NNN.md existentes\n    REG->>REG: número = máximo + 1 (1 si no hay) → issue-NNN.md\n    REG->>FS: writeFile(Markdown, flag wx: falla si ya existe, nunca sobrescribe)\n    REG-->>AG: \"Issue creado satisfactoriamente: issues/issue-NNN.md\"\n```\n\nFormato del archivo generado:\n\n```markdown\n# Issue #1: Título\n\n## Metadata\n\n- **Fecha:** 2026-11-25\n- **Prioridad:** high\n- **Etiquetas:** bug, rag\n- **Estado:** abierto\n\n## Descripción\n\nTexto de la descripción\n\n---\n\n*Issue creado automáticamente por DevAssistant*\n```\n\n## 8. Code review (`npm run review`) ✅\n\n```mermaid\nsequenceDiagram\n    actor Dev as 👤 Desarrollador\n    participant CR as exercises/code-reviewer.ts\n    participant FS as 📁 archivo\n    participant ST as llm/streaming.ts\n    participant API as ☁️ Claude\n\n    Dev->>CR: npm run review ./src/config.ts\n    CR->>CR: ¿hay argumento? si no → uso y exit(1)\n    CR->>FS: existsSync → si no existe: exit(1)\n    CR->>CR: extensión soportada? (si no, solo warning)\n    CR->>FS: readFileSync (si > 20.000 chars → trunca)\n    CR->>ST: streamClaude(prompt con el código, CODE_REVIEWER_PROMPT)\n    ST->>API: messages.stream(max_tokens 1024)\n    API-->>Dev: review en tiempo real (✅ ⚠️ 🐛 🔒 + nota 1–10)\n```\n\n## 9. Demo automática (`npm run demo`) ✅\n\nEjecuta 4 escenarios con un mismo `DevAssistantAgent`, llamando a `clearHistory()` y esperando 800 ms entre ellos:\n\n| # | Escenario | Pregunta | Tools esperadas |\n|---|---|---|---|\n| 1 | Exploración de código | \"¿Qué funciones y valores exporta src/rag/retriever.ts?\" | `read_file` o `search_code` |\n| 2 | Búsqueda en docs | \"¿Cómo se autentican las peticiones a la API…?\" | `search_docs` (requiere ingesta previa) |\n| 3 | Tarea multi-tool | \"Lista los archivos de src/agent y lee el system prompt\" | `list_files` + `read_file` |\n| 4 | Crear issue | \"Crea un issue de tipo bug: el vector store falla…\" | `create_issue` → escribe en `issues/` |\n\n## 10. RAG directo sin agente (`askWithRAG`) ✅\n\n> No está conectado a la CLI.\n\n`rag/rag-chain.ts` implementa el patrón RAG \"clásico\": recuperar → construir prompt aumentado → responder en streaming con un system prompt que obliga a usar **solo** el contexto. No lo usa ningún punto de entrada actual; es la versión previa (Sección RAG del curso) a convertir el RAG en una tool del agente.\n\n```mermaid\nflowchart LR\n    Q[\"Pregunta\"] --> R[\"retrieveContext(pregunta, RAG_TOP_K)\"]\n    R -->|0 chunks| N[\"'No hay documentación… usa /ingest'\"]\n    R -->|chunks| F[\"formatContext → [FUENTE…] contenido\"]\n    F --> P[\"Prompt aumentado:<br/>contexto + instrucciones + pregunta\"]\n    P --> S[\"streamClaudeWithCallback(prompt, onChunk, RAG_SYSTEM_PROMPT)\"]\n    S --> A[\"Respuesta citando fuente\"]\n```\n\n---\n\n> 📝 **Plantilla — preguntas a responder en tu proyecto**\n> 1. ¿Cuáles son los flujos principales (arranque, operación central, flujos secundarios)?\n> 2. Para cada uno: ¿quién participa y en qué orden? (diagrama de secuencia)\n> 3. ¿Qué decisiones/ramas hay? (diagrama de actividad o de estados)\n> 4. ¿Qué efectos secundarios produce (archivos, red, BD)?\n"},{"file":"05-modelo-datos.md","num":"05","title":"05 · Modelo de datos","md":"# 05 · Modelo de datos\n\n> **Propósito de esta sección:** describir las estructuras de datos (interfaces TypeScript), las clases con estado y el esquema de la base de datos.\n\n## 🧬 Diagrama de clases UML\n\n```mermaid\nclassDiagram\n    direction LR\n\n    class Message {\n        <<interface>>\n        +role: Role\n        +content: string\n    }\n    class ToolDefinition {\n        <<interface>>\n        +name: string\n        +description: string\n        +input_schema: object\n    }\n    class Chunk {\n        <<interface>>\n        +id: string\n        +content: string\n        +metadata: ChunkMetadata\n    }\n    class ChunkMetadata {\n        +source: string\n        +heading: string\n        +position: number\n        +charCount: number\n    }\n    class RetrievedChunk {\n        <<interface>>\n        +score: number\n    }\n    class SearchResult {\n        <<interface>>\n        +chunk: Chunk\n        +score: number\n    }\n    class AgentResponse {\n        <<interface>>\n        +text: string\n        +toolsUsed: string[]\n        +inputTokens: number\n        +outputTokens: number\n    }\n    class AppConfig {\n        <<interface>>\n        +anthropicApiKey: string\n        +openaiApiKey: string\n        +anthropicModel: string\n        +openaiEmbeddingModel: string\n        +embeddingDimensions: number\n        +docsPath: string\n        +dbPath: string\n        +ragTopK: number\n    }\n\n    class DevAssistantAgent {\n        -messages: MessageParam[]\n        -totalInputTokens: number\n        -totalOutputTokens: number\n        -turns: number\n        -toolCallsLastTurn: number\n        -systemPrompt: string\n        -callModel(onChunk?) Promise~Message~\n        +chat(userMessage, onChunk?) Promise~AgentResponse~\n        +clearHistory() void\n        +getStats() Stats\n    }\n    class VectorStore {\n        -db: Database\n        -storedDimensions: number\n        -dimensions: number\n        +constructor(dbPath, dimensions)\n        -createTables() number\n        +insert(chunk, embedding) void\n        +insertMany(chunks, embeddings) void\n        +search(queryEmbedding, topk) SearchResult[]\n        +clear() void\n        +size: number\n        +embeddingDimensions: number\n        +close() void\n    }\n    class RateLimiter {\n        -timestamps: number[]\n        -config: RateLimiterConfig\n        +check() boolean\n        +reset() void\n        +remaining: number\n    }\n    class Conversation {\n        -messages: Message[]\n        -systemPrompt: string\n        -totalInputsTokens: number\n        -totalOutputsTokens: number\n        +addUserMessage(text) void\n        +addAssistantMessage(text) void\n        +send() Promise~string~\n        +clear() void\n        +getTurnCount() number\n        +estimateCurrentTokens() number\n        +getStats() object\n        +getHistory() Message[]\n    }\n    class GuardrailResult {\n        <<interface>>\n        +safe: boolean\n        +reason?: string\n        +sanitized: string\n    }\n    class RateLimiterConfig {\n        <<interface>>\n        +maxRequests: number\n        +windowMs: number\n    }\n    class TokenUsage {\n        <<interface>>\n        +inputTokens: number\n        +outputTokens: number\n        +model: string\n    }\n    class CostBreakdown {\n        <<interface>>\n        +inputCost: number\n        +outputCost: number\n        +totalCost: number\n        +model: string\n        +formatted: string\n    }\n\n    Chunk *-- ChunkMetadata\n    Chunk <|-- RetrievedChunk\n    SearchResult o-- Chunk\n    DevAssistantAgent ..> AgentResponse : devuelve\n    DevAssistantAgent ..> ToolDefinition : usa 5\n    VectorStore ..> SearchResult : devuelve\n    VectorStore ..> Chunk : almacena\n    RateLimiter o-- RateLimiterConfig\n    Conversation o-- Message\n```\n\nTipo unión (`src/types.ts`):\n\n```ts\ntype Role = \"user\" | \"assistant\";\n```\n\n## 📋 Descripción de cada estructura\n\n| Estructura | Archivo | Qué representa | Quién la produce | Quién la consume |\n|---|---|---|---|---|\n| `Message` | `interface.ts` | Mensaje simple de texto (rol + contenido) | `Conversation` | `Conversation.send()` |\n| `ToolDefinition` | `interface.ts` | Esquema de una tool en formato Anthropic (`name`, `description`, `input_schema` JSON Schema) | `tools/definitions.ts`, `agent/tool-registry.ts` | `DevAssistantAgent`, `runWithTools`, `/tools` |\n| `Chunk` | `interface.ts` | Fragmento de documento listo para indexar | `chunker.ts` | `VectorStore.insert`, ingesta |\n| `RetrievedChunk` | `interface.ts` | `Chunk` + `score` de similitud | `retriever.ts` | `search_docs`, `rag-chain.ts` |\n| `SearchResult` | `interface.ts` | Par `{chunk, score}` devuelto por la BD | `VectorStore.search` | `retriever.ts` |\n| `AgentResponse` | `interface.ts` | Resultado de un turno del agente | `DevAssistantAgent.chat` | `cli.ts`, `demo.ts` |\n| `AppConfig` | `interface.ts` | Configuración tipada de toda la app | `config.ts` | Todos los módulos |\n| `GuardrailResult` | `security/guardrails.ts` | Veredicto de seguridad + texto sanitizado | `checkGuardrails` | `cli.ts` |\n| `RateLimiterConfig` | `security/guardrails.ts` | Máx. peticiones por ventana de tiempo | `createRateLimiter` | `RateLimiter` |\n| `TokenUsage` / `CostBreakdown` | `utils/cost-calculator.ts` | Entrada y salida del cálculo de costo | `cli.ts` | `calculateCost` |\n\n### Ejemplo de `Chunk` real (corpus TaskFlow)\n\n```json\n{\n  \"id\": \"api-reference.md-1\",\n  \"content\": \"# TaskFlow API Reference\\n\\n## Base URL\\n\\n```\\nhttps://api.taskflow.app/v1\\n```\\n\\nPara desarrollo local:\\n\\n```\\nhttp://localhost:3000/v1\\n```\",\n  \"metadata\": {\n    \"source\": \"api-reference.md\",\n    \"heading\": \"## Base URL\",\n    \"position\": 1,\n    \"charCount\": 132\n  }\n}\n```\n\nFíjate en que el contenido empieza con `# TaskFlow API Reference`: es el **párrafo de solapamiento** que viene del chunk anterior.\n\n## 🗄️ Esquema de la base de datos (`data/vectors.db`)\n\n```mermaid\nerDiagram\n    chunks ||--|| chunk_embeddings : \"id = chunk_id\"\n    meta {\n        TEXT key PK \"embedding_dimensions\"\n        TEXT value \"p.ej. 1536\"\n    }\n    chunks {\n        TEXT id PK \"archivo-posición, ej: README.md-3\"\n        TEXT content \"texto completo del chunk\"\n        TEXT source \"nombre del archivo .md\"\n        TEXT heading \"## Encabezado o (Introducción)\"\n        INTEGER position \"orden dentro del archivo\"\n        INTEGER char_count \"longitud del contenido\"\n    }\n    chunk_embeddings {\n        TEXT chunk_id \"PARTITION KEY → chunks.id\"\n        FLOAT_N embedding \"vector float32, N = dimensión guardada en meta\"\n    }\n```\n\n- `chunks` es una tabla normal de SQLite.\n- `chunk_embeddings` es una **tabla virtual `vec0`** de `sqlite-vec`. La búsqueda KNN se hace con `WHERE embedding MATCH ? AND k = ?` y devuelve una columna `distance` (distancia L2).\n- Los embeddings se guardan como `Buffer` de un `Float32Array` (`serializeEmbedding`).\n- **Score**: `1 − distance / 2`. Como los embeddings de OpenAI están normalizados, la distancia L2 está entre 0 y 2, así que el score queda entre 0 y 1 (1 = idéntico).\n- La BD usa `journal_mode = WAL` → por eso existen `vectors.db-wal` y `vectors.db-shm`.\n- La dimensión del vector (`float[N]`) se decide al **crear** la tabla con `config.embeddingDimensions` y se guarda en la tabla `meta` (`embedding_dimensions`). Si cambias de modelo de embeddings, la base sigue con la dimensión anterior hasta que vuelvas a ingestar: `clear()` borra la tabla y la recrea con la dimensión nueva. Insertar o buscar con otra dimensión lanza un error explicativo.\n- Las bases creadas antes de existir la tabla `meta` se reconocen automáticamente como de 1536 dimensiones.\n\n## 🔄 Ciclo de vida de un Chunk\n\n```mermaid\nstateDiagram-v2\n    [*] --> Markdown: archivo .md en DOCS_PATH\n    Markdown --> Chunk: chunkMarkdown() divide por ##\n    Chunk --> Embebido: generateEmbeddings() (OpenAI)\n    Embebido --> Almacenado: VectorStore.insert()\n    Almacenado --> Recuperado: search() top-K por similitud\n    Recuperado --> Contexto: formateado como [FUENTE…]\n    Contexto --> Respuesta: Claude cita archivo y sección\n    Almacenado --> [*]: clear() en la siguiente ingesta\n```\n\n## 🧾 Estructuras de mensajes de la API de Anthropic usadas\n\n| Bloque | Dirección | Contenido clave |\n|---|---|---|\n| `text` | Claude → app | Texto de respuesta |\n| `tool_use` | Claude → app | `id`, `name`, `input` (JSON con los parámetros) |\n| `tool_result` | app → Claude (en un mensaje `user`) | `tool_use_id` (el mismo `id`), `content` (string) |\n| `usage` | Claude → app | `input_tokens`, `output_tokens` (se acumulan para `/stats`) |\n| `stop_reason` | Claude → app | `end_turn`, `tool_use`, `max_tokens`… (decide el siguiente paso del loop) |\n\n## 📄 Archivos de datos generados\n\n| Archivo | Generado por | Contenido |\n|---|---|---|\n| `data/vectors.db` (+ `-wal`, `-shm`) | `VectorStore` | Chunks y embeddings |\n| `data/chunks-preview.json` | `npm run ingest` | Por chunk: id, primeros 200 chars, metadata, primeros 5 valores del embedding y número de dimensiones |\n| `issues/issue-NNN.md` | tool `create_issue` | Issue en Markdown |\n\n---\n\n> 📝 **Plantilla — preguntas a responder en tu proyecto**\n> 1. ¿Cuáles son las entidades/interfaces principales y sus campos?\n> 2. ¿Qué clases tienen estado y qué métodos exponen?\n> 3. ¿Cómo es el esquema de persistencia?\n> 4. ¿Cuál es el ciclo de vida de la entidad central?\n"},{"file":"06-funciones-tools.md","num":"06","title":"06 · Funciones y tools","md":"# 06 · Funciones y tools\n\n> **Propósito de esta sección:** documentar las funciones públicas del proyecto y las 5 herramientas (tools) que el modelo puede invocar mediante function calling.\n\n## ⚙️ Funciones públicas por módulo ✅\n\n| Módulo | Función / clase | Firma | Qué hace |\n|---|---|---|---|\n| `config.ts` | `config` | `AppConfig` | Configuración cargada del `.env` |\n| `config.ts` | `validateConfig()` | `() => void` | Lanza error si falta `ANTHROPIC_API_KEY`; avisa si falta `OPENAI_API_KEY` |\n| `chat/cli.ts` | `startCLI()` | `() => Promise<void>` | Abre la CLI interactiva |\n| `agent/agent.ts` | `DevAssistantAgent` | `new (systemPrompt?)` | Agente con historial; `chat()`, `clearHistory()`, `getStats()` |\n| `agent/tool-registry.ts` | `ALL_TOOL_DEFINITIONS` | `ToolDefinition[]` | Las 5 tools del agente |\n| `agent/tool-registry.ts` | `executeAnyTool(name, params)` | `=> Promise<string>` | Despacha cualquier tool por nombre |\n| `tools/definitions.ts` | `TOOL_DEFINITIONS` | `ToolDefinition[]` | Las 3 tools de archivos |\n| `tools/executor.ts` | `executeTool(name, params)` | `=> Promise<string>` | Ejecuta las 3 tools de archivos con validación y sandbox (`realpath`) |\n| `tools/executor.ts` | `isSecretFile(path)` | `=> boolean` | `true` para `.env`, `.env.local`…; `false` para `.env.template/.example/.sample` |\n| `tools/agent-loop.ts` | `runWithTools(prompt, system?, tools?)` | `=> Promise<string>` | Loop de tools mínimo sin historial (máx. 10 iteraciones) |\n| `rag/chunker.ts` | `chunkMarkdown(content, filePath)` | `=> Chunk[]` | Divide un Markdown en chunks |\n| `rag/chunker.ts` | `processDirectory(dirPath)` | `=> Promise<Chunk[]>` | Chunks de todos los `.md` del directorio **y sus subcarpetas** |\n| `rag/embeddings.ts` | `generateEmbedding(text)` | `=> Promise<number[]>` | Embedding de un texto |\n| `rag/embeddings.ts` | `generateEmbeddings(texts)` | `=> Promise<number[][]>` | Embeddings en lotes de 100 textos |\n| `rag/embeddings.ts` | `getEmbeddingTokensUsed()` | `=> number` | Tokens de embeddings consumidos en el proceso (para `/stats`) |\n| `rag/vector-store.ts` | `VectorStore` | `new (dbPath, dimensions)` | `insert`, `insertMany`, `search`, `clear`, `size`, `embeddingDimensions`, `close` |\n| `rag/retriever.ts` | `retrieveContext(query, topK?)` | `=> Promise<RetrievedChunk[]>` | Búsqueda semántica usando el store singleton |\n| `rag/retriever.ts` | `resetStore()` | `() => void` | Cierra y olvida el singleton (tras re-ingestar) |\n| `rag/rag-chain.ts` | `askWithRAG(question, onChunk?)` | `=> Promise<string>` | RAG completo sin agente, con streaming |\n| `rag/indexer.ts` | `indexDocuments(docsPath, {dbPath?, previewPath?})` | `=> Promise<IndexResult>` | Pipeline de ingesta compartido (CLI y script); no toca la base si no hay `.md` |\n| `rag/ingest.ts` | `runIngest(docsPath?)` | `=> Promise<void>` | Envoltorio de `indexDocuments` con preview JSON; solo se autoejecuta como script |\n| `llm/anthropic-client.ts` | `client` | `Anthropic` | Cliente compartido del SDK |\n| `llm/anthropic-client.ts` | `askClaude(prompt, system?)` | `=> Promise<string>` | Una llamada simple, devuelve el texto |\n| `llm/streaming.ts` | `streamClaude(prompt, system?)` | `=> Promise<string>` | Streaming directo a stdout |\n| `llm/streaming.ts` | `streamClaudeWithCallback(prompt, onChunk, system?)` | `=> Promise<string>` | Streaming con callback por fragmento |\n| `llm/prompts.ts` | `CODE_REVIEWER_PROMPT`, `DOCUMENTATION_ASSISTANT_PROMPT`, `DOCUMENTATION_GENERATOR_PROMPT` | `string` | System prompts reutilizables |\n| `chat/conversation.ts` | `Conversation` | `new (systemPrompt?)` | Chat multi-turno sin tools |\n| `security/guardrails.ts` | `sanitizeInput`, `detectPromptInjection`, `checkGuardrails`, `createRateLimiter`, `RateLimiter` | — | Ver [13 · Seguridad](13-seguridad.md) |\n| `utils/cost-calculator.ts` | `calculateCost(usage)` | `=> CostBreakdown` | Costo USD por tokens y modelo |\n| `utils/cost-calculator.ts` | `formatUSD(amount)` | `=> string` | Formatea importes (`$0.0480`, `< $0.001`) |\n\n## 🛠️ Catálogo de tools (function calling) ✅\n\n| Tool | Definida en | Ejecutada por | Efecto | Parámetros obligatorios |\n|---|---|---|---|---|\n| `list_files` | `tools/definitions.ts` | `tools/executor.ts` | Solo lectura | `path` |\n| `read_file` | `tools/definitions.ts` | `tools/executor.ts` | Solo lectura | `file_path` |\n| `search_code` | `tools/definitions.ts` | `tools/executor.ts` | Solo lectura | `pattern` |\n| `search_docs` | `agent/tool-registry.ts` | `agent/tool-registry.ts` → `rag/retriever.ts` | Solo lectura + llamada a OpenAI | `query` |\n| `create_issue` | `agent/tool-registry.ts` | `agent/tool-registry.ts` | **Escribe en disco** (`./issues/`) | `title`, `description` |\n\n### `list_files`\n\nLista recursivamente los archivos de un directorio del proyecto.\n\n| Parámetro | Tipo | Req. | Descripción |\n|---|---|---|---|\n| `path` | string | ✔ | Directorio relativo al proyecto (`'.'`, `'./src'`) |\n| `extension` | string | | Filtro, ej. `'.ts'` |\n\n- Omite `node_modules`, todo lo que empiece por `.` (`.env`, `.github`…) y los enlaces simbólicos.\n- Devuelve rutas relativas, una por línea. Errores: ruta fuera del proyecto, no existe, no es directorio, sin resultados.\n\n```json\n{ \"name\": \"list_files\", \"input\": { \"path\": \"./src/agent\", \"extension\": \".ts\" } }\n```\n```text\nsrc\\agent\\agent.ts\nsrc\\agent\\demo.ts\nsrc\\agent\\system-prompt.ts\nsrc\\agent\\tool-registry.ts\n```\n\n### `read_file`\n\nLee un archivo completo.\n\n| Parámetro | Tipo | Req. | Descripción |\n|---|---|---|---|\n| `file_path` | string | ✔ | Ruta relativa con nombre y extensión |\n\n- Si el archivo pesa más de **50.000 bytes** devuelve un error en lugar del contenido.\n- **No lee archivos de secretos**: `.env`, `.env.local`, `.env.production`… (sí `.env.template`, `.env.example`, `.env.sample`).\n- Errores: fuera del proyecto (también vía symlink), archivo de secretos, es un directorio, no existe (`ENOENT`).\n\n### `search_code`\n\nBúsqueda por **substring exacto** (sensible a mayúsculas) en los archivos.\n\n| Parámetro | Tipo | Req. | Descripción |\n|---|---|---|---|\n| `pattern` | string | ✔ | Texto literal (no regex) |\n| `path` | string | | Directorio (por defecto `.`) |\n| `file_extension` | string | | Filtro, ej. `'.ts'` |\n\n- Máximo **20 coincidencias**, cada una con **±2 líneas** de contexto. La línea que coincide se marca con `>`.\n\n```text\nCoincidencias: 1\n\n  src\\rag\\retriever.ts: 11: }\n  src\\rag\\retriever.ts: 12: export async function retrieveContext(\n> src\\rag\\retriever.ts: 13: ...\n```\n\n### `search_docs`\n\nBúsqueda semántica en la documentación ingestada.\n\n| Parámetro | Tipo | Req. | Descripción |\n|---|---|---|---|\n| `query` | string | ✔ | Pregunta o tema |\n| `top_k` | number | | Fragmentos a recuperar (por defecto 5, máximo 10) |\n\n- Si el store está vacío, responde pidiendo ejecutar `/ingest`.\n- Formato del resultado:\n\n```text\nSe encontraron 5 fragmentos relevantes:\n\n[FUENTE: api-reference.md | Sección: ## Autenticación | Relevancia: 78%]\n## Autenticación\n…\n\n---\n\n[FUENTE: getting-started.md | Sección: ## Autenticación con JWT | Relevancia: 74%]\n…\n```\n\n> Nota: `search_docs` usa `top_k ?? 5`, **no** `RAG_TOP_K`. `RAG_TOP_K` solo lo usan `retrieveContext()` sin argumento y `askWithRAG()`.\n\n### `create_issue`\n\nCrea un issue Markdown en `./issues/`.\n\n| Parámetro | Tipo | Req. | Descripción |\n|---|---|---|---|\n| `title` | string | ✔ | Título conciso |\n| `description` | string | ✔ | Descripción detallada |\n| `labels` | string[] | | Ej. `[\"bug\",\"rag\"]` (por defecto \"sin etiquetas\") |\n| `priority` | `\"low\" \\| \"medium\" \\| \"high\"` | | Por defecto `medium` |\n\n- Numeración automática: **mayor `issue-NNN.md` existente + 1** → `issue-001.md`, `issue-002.md`… Si borras uno intermedio, el número no se reutiliza.\n- Se escribe con el flag `wx`: si por algún motivo el archivo ya existe, la tool devuelve un error en lugar de sobrescribirlo.\n\n## 🔁 Ciclo de vida de una invocación de tool\n\n```mermaid\nsequenceDiagram\n    participant C as ☁️ Claude\n    participant A as DevAssistantAgent\n    participant R as executeAnyTool\n    participant E as executor / RAG / fs\n\n    A->>C: messages + tools[5]\n    C-->>A: stop_reason tool_use<br/>tool_use {id, name, input}\n    A->>R: executeAnyTool(name, input)\n    R->>R: switch(name)\n    R->>E: ejecuta (valida params, sandbox)\n    E-->>R: string (resultado o \"Error: …\")\n    R-->>A: string\n    A->>C: user: tool_result {tool_use_id: id, content}\n    C-->>A: siguiente paso (otra tool o end_turn)\n```\n\n## ➕ Cómo añadir una tool nueva (receta)\n\n1. **Definir el esquema** en `src/agent/tool-registry.ts` (o en `tools/definitions.ts` si es de archivos):\n   ```ts\n   const MI_TOOL: ToolDefinition = {\n     name: \"mi_tool\",\n     description: \"Qué hace y CUÁNDO debe usarla el modelo.\",\n     input_schema: {\n       type: \"object\",\n       properties: { param: { type: \"string\", description: \"…\" } },\n       required: [\"param\"],\n     },\n   };\n   ```\n2. **Implementar** una función `async function executeMiTool(params): Promise<string>` que **nunca lance excepciones**: captura errores y devuelve `\"Error: …\"`.\n3. **Registrar** la definición en `ALL_TOOL_DEFINITIONS`.\n4. **Despachar** añadiendo un `case \"mi_tool\":` en el `switch` de `executeAnyTool`, y actualiza el texto \"Tools disponibles\" del `default`.\n5. **Enseñar al modelo**: añade la tool y su regla de decisión en `src/agent/system-prompt.ts` (hoy dice \"Tienes acceso a 5 herramientas\").\n6. Si toca el sistema de archivos, reutiliza el patrón `resolveSecurePath` de `tools/executor.ts`.\n7. Añade un caso en `tests/tools.test.ts` (las tools se pueden probar sin API), ejecuta `npm run typecheck` y `npm test`, y pruébala con `/tools` y una pregunta en `npm run dev`.\n\n## ✅ Buenas prácticas aplicadas en las tools\n\n- **Descripciones orientadas a \"cuándo usarla\"**, no solo a qué hace: el modelo decide con ellas.\n- **Validación de tipos en tiempo de ejecución** (`typeof p.path !== \"string\"`): el `input` del modelo no es de confianza.\n- **Errores como texto**: el modelo los lee y puede reintentar con otros parámetros.\n- **Límites de tamaño** (50.000 bytes, 20 coincidencias, top_k ≤ 10) para no saturar el contexto.\n- **Sandbox** de rutas con `realpath`, exclusión de archivos ocultos y bloqueo explícito de `.env*`.\n\n---\n\n> 📝 **Plantilla — preguntas a responder en tu proyecto**\n> 1. ¿Qué funciones públicas expone cada módulo?\n> 2. ¿Qué tools puede invocar el modelo, con qué parámetros y efectos?\n> 3. ¿Cómo se añade una nueva?\n> 4. ¿Qué validaciones y límites aplica cada tool?\n"},{"file":"07-configuracion.md","num":"07","title":"07 · Configuración y ejecución","md":"# 07 · Configuración y ejecución\n\n> **Propósito de esta sección:** cómo se instala, configura y ejecuta el proyecto. Para un tutorial paso a paso, ver [11 · Guía de uso](11-guia-de-uso.md).\n\n## 🚀 Puesta en marcha\n\n```bash\ncd DEV-ASSITANT\nnpm install\ncp .env.template .env     # y edita las API keys\nnpm run typecheck         # verificación estática (src + tests)\nnpm test                  # 41 tests, sin llamar a APIs\nnpm run dev               # CLI interactiva\n```\n\nRequisitos: **Node.js 18+** (probado con Node 22), npm 9+, API key de **Anthropic** (obligatoria) y de **OpenAI** (para RAG).\n\n## 🔐 Variables de entorno\n\n| Variable | Obligatoria | Por defecto | Usada en | Descripción |\n|---|---|---|---|---|\n| `ANTHROPIC_API_KEY` | ✔ | `\"\"` | `llm/anthropic-client.ts` | Key de Claude. Sin ella la CLI no arranca |\n| `OPENAI_API_KEY` | Para RAG | `\"\"` | `rag/embeddings.ts` | Key de OpenAI (solo embeddings). Sin ella fallan `/ingest` y `search_docs` |\n| `ANTHROPIC_MODEL` | | `claude-sonnet-4-6` | agente, streaming, conversación, `/stats` | Modelo de Claude |\n| `OPENAI_EMBEDDING_MODEL` | | `text-embedding-3-small` | `rag/embeddings.ts`, `config.ts` | Modelo de embeddings. Si lo cambias, vuelve a ingestar |\n| `EMBEDDING_DIMENSIONS` | Solo para modelos desconocidos | según el modelo (`3-small`/`ada-002` → 1536, `3-large` → 3072) | `config.ts`, `VectorStore` | Dimensión de los vectores (ver [05](05-modelo-datos.md)) |\n| `DOCS_PATH` | | `./docs/sample-project` | `/ingest` sin ruta, `npm run ingest` | Directorio con los `.md` a indexar (incluye subcarpetas) |\n| `DB_PATH` | | `./data/vectors.db` | `VectorStore` | Ruta de la base vectorial (se crea la carpeta si no existe) |\n| `RAG_TOP_K` | | `5` | `retrieveContext()` por defecto, `askWithRAG()` | Chunks a recuperar |\n\n> Todas las rutas relativas se resuelven respecto al **directorio desde el que ejecutas** el comando. Ejecuta siempre desde la raíz `DEV-ASSITANT/`.\n\n## 🧭 Flujo de carga de configuración\n\n```mermaid\nflowchart LR\n    A[\".env\"] -->|dotenv| B[\"process.env\"]\n    B --> C[\"getRequiredEnvVar(nombre, defecto)\"]\n    C --> D[\"config: AppConfig\"]\n    B --> P[\"resolveEmbeddingDimensions(modelo)\"]\n    P -->|modelo desconocido sin EMBEDDING_DIMENSIONS| X[\"throw Error al importar config.ts\"]\n    P --> D\n    D --> V[\"validateConfig() en index.ts\"]\n    V -->|sin ANTHROPIC_API_KEY| Y[\"Error y exit(1)\"]\n    V -->|sin OPENAI_API_KEY| W[\"warning, continúa\"]\n    D --> M[\"Todos los módulos importan config\"]\n```\n\n## 📜 Comandos npm\n\n| Comando | Ejecuta | Llama a APIs de pago | Descripción |\n|---|---|---|---|\n| `npm run dev` / `npm start` | `tsx src/index.ts` | Sí | CLI interactiva con el agente |\n| `npm run ingest` | `tsx src/rag/ingest.ts` | Sí (OpenAI) | Indexa `DOCS_PATH` en `DB_PATH` y escribe `data/chunks-preview.json` |\n| `npm run demo` | `tsx src/agent/demo.ts` | Sí (Claude, y OpenAI si hay docs) | 4 escenarios automáticos del agente |\n| `npm run review <archivo>` | `tsx src/exercises/code-reviewer.ts` | Sí (Claude) | Code review de un archivo en streaming |\n| `npm run typecheck` | `tsc --noEmit && tsc -p tests/tsconfig.json` | No | Typecheck de `src/` y de `tests/` |\n| `npm test` | `tsx --test \"tests/**/*.test.ts\"` | **No** | 41 tests con `node:test` (chunker, vector store, guardrails, costos, tools) |\n| `npm run build` | `tsc` | No | Compila a `dist/` (JS + `.d.ts` + source maps) |\n| `npx tsx src/security/examples.ts` | — | **No** | Demostración de los guardrails (sin script npm) |\n| `npx tsx src/<ruta>.ts` | — | Depende | Ejecutar cualquier módulo suelto |\n\n## ⌨️ Comandos dentro de la CLI\n\n| Comando | Alias | Qué hace |\n|---|---|---|\n| `/ingest [ruta]` | | Indexa los `.md` de `ruta` (o `DOCS_PATH`) y sus subcarpetas. **Reemplaza** el índice anterior (si no hay `.md`, no lo toca) |\n| `/stats` | | Turnos de la conversación, tokens de Claude y de embeddings acumulados en la sesión, costo estimado (chat + embeddings), tool calls del último turno |\n| `/tools` | | Lista las 5 tools con sus parámetros y la primera frase de su descripción |\n| `/clear` | `/limpiar` | Borra el historial del agente. Los tokens y el costo de la sesión se mantienen (a propósito) |\n| `/exit` | `/salida` | Muestra el resumen y cierra |\n| *cualquier otro texto* | | Pasa por los guardrails y se envía al agente |\n\n## ⚙️ Constantes internas (no configurables por `.env`)\n\n| Constante | Valor | Archivo | Efecto |\n|---|---|---|---|\n| `MAX_TOOL_CALLS` | 8 | `agent/agent.ts` | Tool calls por turno del agente |\n| `max_tokens` | 4096 / 1024 | `agent.ts` / `streaming.ts`, `conversation.ts`, `anthropic-client.ts` | Tokens máximos de salida por llamada |\n| `MAX_ITERATIONS` | 10 | `tools/agent-loop.ts` | Iteraciones del loop simple |\n| `MAX_CHUNK_SIZE` | 2000 | `rag/chunker.ts` | Caracteres por chunk |\n| `BATCH_SIZE` | 100 | `rag/embeddings.ts` | Textos por petición de embeddings |\n| `MAX_FILE_SIZE` | 50.000 | `tools/executor.ts` | Bytes máximos para `read_file` |\n| `MAX_SEARCH_RESULTS` / `CONTEXT_LINES` | 20 / 2 | `tools/executor.ts` | Límite y contexto de `search_code` |\n| `MAX_LENGTH` | 8.000 | `security/guardrails.ts` | Caracteres máximos de entrada |\n| Rate limit | 10 peticiones / 60 s | `security/guardrails.ts` (`createRateLimiter`) | Mensajes al agente por minuto |\n| `MAX_CHARS` | 20.000 | `exercises/code-reviewer.ts` | Caracteres revisados por archivo |\n| `PRICING` | tabla | `utils/cost-calculator.ts` | Precios USD por millón de tokens (fallback: Sonnet) |\n\n## ☁️ GitHub Codespaces\n\n- `.devcontainer/devcontainer.json`: imagen `typescript-node:22`, ejecuta `.github/codespaces/post-create.sh` al crear el contenedor, declara los secrets `ANTHROPIC_API_KEY` y `OPENAI_API_KEY` y recomienda la extensión de Mermaid para VS Code.\n- `post-create.sh`: `npm install`, crea `data/` y copia `.env.template` a `.env` si no existe.\n- Codespaces inyecta los secrets como variables de entorno; `dotenv` **no** sobrescribe variables ya definidas, así que los valores de ejemplo del `.env` copiado no las pisan.\n\n## 📂 Archivos generados (ignorados en git)\n\n| Ruta | Generado por | ¿Se puede borrar? |\n|---|---|---|\n| `data/vectors.db`, `-wal`, `-shm` | `/ingest`, `npm run ingest`, primera búsqueda | Sí: se recrea vacío; hay que re-ingestar |\n| `data/chunks-preview.json` | `npm run ingest` | Sí (solo informativo) |\n| `issues/*.md` | tool `create_issue` | Sí |\n| `dist/` | `npm run build` | Sí |\n| `.env` | tú | No (contiene tus keys) |\n\n---\n\n> 📝 **Plantilla — preguntas a responder en tu proyecto**\n> 1. ¿Qué se necesita instalar y cómo se arranca?\n> 2. ¿Qué variables de entorno existen, cuáles son obligatorias y dónde se usan?\n> 3. ¿Qué comandos hay y cuáles cuestan dinero?\n> 4. ¿Qué constantes internas conviene conocer?\n> 5. ¿Qué archivos se generan y se pueden borrar?\n"},{"file":"08-roadmap.md","num":"08","title":"08 · Roadmap","md":"# 08 · Roadmap\n\n> **Propósito de esta sección:** mostrar en qué fase está el proyecto, qué está hecho y qué falta.\n\n## 🧭 Fases (secciones del curso)\n\n```mermaid\ntimeline\n    title DevAssistant - fases de construcción\n    Fase 1 - Base : Proyecto TypeScript + tsx : Configuración con .env : Tipos e interfaces\n    Fase 2 - LLM : askClaude : Streaming : Conversation multi-turno : Prompts reutilizables\n    Fase 3 - Function calling : Tools de archivos : Executor con sandbox : runWithTools\n    Fase 4 - RAG : Chunking : Embeddings OpenAI : SQLite + sqlite-vec : askWithRAG\n    Fase 5 - Seguridad y costos : Guardrails : Rate limit : Cost calculator\n    Fase 6 - Agente completo : DevAssistantAgent : search_docs y create_issue : CLI con comandos : Demo\n    Ejercicios : Code reviewer\n```\n\n## ✅ Estado detallado\n\n| Fase | Entregable | Archivo(s) | Estado |\n|---|---|---|---|\n| 1 · Base | Proyecto TS (ESM, strict, `tsx`) | `package.json`, `tsconfig.json` | ✅ |\n| 1 · Base | Configuración con validación | `config.ts` | ✅ |\n| 1 · Base | Interfaces y tipos compartidos | `interface.ts`, `types.ts` | ✅ |\n| 2 · LLM | Llamada simple a Claude | `llm/anthropic-client.ts` | ✅ |\n| 2 · LLM | Streaming | `llm/streaming.ts` | ✅ |\n| 2 · LLM | Conversación multi-turno | `chat/conversation.ts` | ✅ (no usada por la CLI) |\n| 2 · LLM | System prompts reutilizables | `llm/prompts.ts` | ✅ |\n| 3 · Function calling | Definición de tools de archivos | `tools/definitions.ts` | ✅ |\n| 3 · Function calling | Executor con sandbox | `tools/executor.ts` | ✅ |\n| 3 · Function calling | Loop de tools simple | `tools/agent-loop.ts` | ✅ (no usado por la CLI) |\n| 4 · RAG | Chunking Markdown con solapamiento | `rag/chunker.ts` | ✅ |\n| 4 · RAG | Embeddings | `rag/embeddings.ts` | ✅ |\n| 4 · RAG | Vector store SQLite | `rag/vector-store.ts` | ✅ |\n| 4 · RAG | Retriever + ingesta | `rag/retriever.ts`, `rag/ingest.ts` | ✅ |\n| 4 · RAG | Cadena RAG directa | `rag/rag-chain.ts` | ✅ (no usada por la CLI) |\n| 5 · Seguridad | Sanitización, prompt injection, rate limit | `security/guardrails.ts` | ✅ |\n| 5 · Seguridad | Ejemplos de guardrails | `security/examples.ts` | ✅ |\n| 5 · Costos | Calculadora de costos | `utils/cost-calculator.ts` | ✅ |\n| 6 · Agente | Agente con loop, límite y streaming | `agent/agent.ts` | ✅ |\n| 6 · Agente | Registro de 5 tools | `agent/tool-registry.ts` | ✅ |\n| 6 · Agente | CLI con comandos | `chat/cli.ts`, `index.ts` | ✅ |\n| 6 · Agente | Demo automatizada | `agent/demo.ts` | ✅ |\n| Ejercicio | Code reviewer | `exercises/code-reviewer.ts` | ✅ |\n| Calidad | Corrección de 20 bugs detectados al documentar | varios | ✅ (ver [14](14-problemas-conocidos.md)) |\n| Calidad | Deuda técnica D1–D17 (streaming real, ingesta unificada, dimensiones, sandbox…) | varios | ✅ (ver [14](14-problemas-conocidos.md)) |\n| Calidad | Tests automatizados (`npm test`, 41 tests) | `tests/` | ✅ |\n| Calidad | Devcontainer funcional para Codespaces | `.devcontainer/` | ✅ |\n| Calidad | Ingesta en lotes y recursiva | `rag/indexer.ts`, `rag/chunker.ts`, `rag/embeddings.ts` | ✅ |\n| — | OpenAI como LLM del chat | — | ❌ Descartado: se eliminaron `MODEL_PROVIDER` y `OPENAI_MODEL` |\n\n## 🔜 Siguientes pasos sugeridos\n\n1. **Prompt caching** del system prompt y las tools (cada paso del loop los reenvía).\n2. **Varias colecciones** de documentos (hoy cada `/ingest` reemplaza el índice).\n3. **Tests con la API simulada** para el loop del agente (`DevAssistantAgent`) y `indexDocuments`.\n4. **Defensa contra injection indirecta**: marcar en el system prompt que el contenido de tools es dato, no instrucción.\n5. Renombrar la carpeta `DEV-ASSITANT` → `DEV-ASSISTANT` cuando no afecte a otras rutas.\n6. Revisar la tabla `PRICING` cuando cambien las tarifas.\n\n## 💭 Ideas futuras (fuera del alcance actual)\n\n- Interfaz web o bot de Slack.\n- Indexar fuentes remotas (Confluence, Notion, GitHub Wiki).\n- Memoria de conversación persistente.\n- Evaluación automática de la calidad de las respuestas.\n- Sincronizar `create_issue` con GitHub Issues.\n- Prompt caching para reducir el costo del system prompt y las tools en cada llamada.\n\n---\n\n> 📝 **Plantilla — preguntas a responder en tu proyecto**\n> 1. ¿En qué fases se divide la construcción?\n> 2. ¿Qué entregables tiene cada fase y en qué estado están?\n> 3. ¿Qué sigue y qué ideas quedan para después?\n"},{"file":"09-catalogo-archivos.md","num":"09","title":"09 · Catálogo de archivos","md":"# 09 · Catálogo de archivos\n\n> **Propósito de esta sección:** una ficha por cada archivo del proyecto. Cada ficha responde: **para qué sirve**, **qué exporta**, **de qué depende**, **quién lo usa**, **cómo se usa/ejecuta**, **si es reutilizable** y **notas** (detalles no obvios).\n\nLeyenda de reutilización: ♻️ **Alta** (se copia tal cual) · 🔧 **Media** (se copia con ajustes) · 📌 **Específico** de este proyecto.\n\n## 🗂️ Vista general\n\n| Archivo | Capa | Rol en una línea | Reutilizable |\n|---|---|---|---|\n| [`src/index.ts`](#srcindexts) | Entrada | Arranca la CLI | 📌 |\n| [`src/config.ts`](#srcconfigts) | Transversal | Carga y valida `.env` | 🔧 |\n| [`src/interface.ts`](#srcinterfacets) | Transversal | Interfaces compartidas | 🔧 |\n| [`src/types.ts`](#srctypests) | Transversal | Tipos unión | ♻️ |\n| [`src/agent/agent.ts`](#srcagentagentts) | Agente | `DevAssistantAgent`: agentic loop | 🔧 |\n| [`src/agent/system-prompt.ts`](#srcagentsystem-promptts) | Agente | System prompt del agente | 📌 |\n| [`src/agent/tool-registry.ts`](#srcagenttool-registryts) | Agente | 5 tools + despachador | 🔧 |\n| [`src/agent/demo.ts`](#srcagentdemots) | Entrada | Demo de 4 escenarios | 📌 |\n| [`src/chat/cli.ts`](#srcchatclits) | Interfaz | CLI interactiva y comandos `/` | 🔧 |\n| [`src/chat/conversation.ts`](#srcchatconversationts) | LLM | Chat multi-turno sin tools | ♻️ |\n| [`src/exercises/code-reviewer.ts`](#srcexercisescode-reviewerts) | Entrada | Code review de un archivo | ♻️ |\n| [`src/llm/anthropic-client.ts`](#srcllmanthropic-clientts) | LLM | Cliente Anthropic + `askClaude` | ♻️ |\n| [`src/llm/streaming.ts`](#srcllmstreamingts) | LLM | Helpers de streaming | ♻️ |\n| [`src/llm/prompts.ts`](#srcllmpromptsts) | LLM | System prompts reutilizables | ♻️ |\n| [`src/rag/indexer.ts`](#srcragindexerts) | RAG | Pipeline de ingesta compartido | 🔧 |\n| [`src/rag/chunker.ts`](#srcragchunkerts) | RAG | Markdown → chunks | ♻️ |\n| [`src/rag/embeddings.ts`](#srcragembeddingsts) | RAG | Texto → vector (OpenAI) | ♻️ |\n| [`src/rag/vector-store.ts`](#srcragvector-storets) | RAG | SQLite + sqlite-vec | ♻️ |\n| [`src/rag/retriever.ts`](#srcragretrieverts) | RAG | Búsqueda semántica (singleton) | 🔧 |\n| [`src/rag/rag-chain.ts`](#srcragrag-chaints) | RAG | RAG completo sin agente | 🔧 |\n| [`src/rag/ingest.ts`](#srcragingestts) | Entrada | Script de ingesta | 📌 |\n| [`src/security/guardrails.ts`](#srcsecurityguardrailsts) | Seguridad | Sanitización, injection, rate limit | ♻️ |\n| [`src/security/examples.ts`](#srcsecurityexamplests) | Entrada | Demo de guardrails | 📌 |\n| [`src/tools/definitions.ts`](#srctoolsdefinitionsts) | Tools | Esquemas de 3 tools de archivos | ♻️ |\n| [`src/tools/executor.ts`](#srctoolsexecutorts) | Tools | Ejecución con sandbox | ♻️ |\n| [`src/tools/agent-loop.ts`](#srctoolsagent-loopts) | Tools | Loop de tools mínimo | ♻️ |\n| [`src/utils/cost-calculator.ts`](#srcutilscost-calculatorts) | Utils | Costo USD por tokens | ♻️ |\n| [`tests/*.test.ts`](#-tests) | Tests | 41 tests con `node:test` | 🔧 |\n\n---\n\n## 📍 Raíz `src/`\n\n### `src/index.ts`\n\n| | |\n|---|---|\n| **Propósito** | Punto de entrada de `npm run dev` / `npm start`. |\n| **Hace** | `main()`: llama a `validateConfig()` y luego a `startCLI()`. Si algo falla imprime el error y sale con código 1. |\n| **Exporta** | Nada (es un script). |\n| **Depende de** | `config.ts`, `chat/cli.ts` |\n| **Usado por** | `package.json` (`dev`, `start`, `main`) |\n| **Reutilizable** | 📌 |\n| **Notas** | Llama a `validateConfig()` antes de abrir la CLI (corrección B16 de [14](14-problemas-conocidos.md)). |\n\n### `src/config.ts`\n\n| | |\n|---|---|\n| **Propósito** | Única fuente de configuración. Carga `.env` con `dotenv` y construye un objeto `AppConfig` tipado. |\n| **Exporta** | `config` (named y default), `validateConfig()` |\n| **Funciones internas** | `getRequiredEnvVar(name, default?)` (lanza si no hay valor ni default), `resolveEmbeddingDimensions(model)` (tabla de modelos conocidos o `EMBEDDING_DIMENSIONS`) |\n| **Depende de** | `dotenv`, `interface.ts` |\n| **Usado por** | Casi todos los módulos |\n| **Cómo se usa** | `import config from \"../config.js\"; config.anthropicModel` |\n| **Reutilizable** | 🔧 Cambia los campos de `AppConfig` y los nombres de las variables. |\n| **Notas** | Se evalúa al importarse: un modelo de embeddings desconocido sin `EMBEDDING_DIMENSIONS` (o un valor inválido) rompe cualquier script que lo importe. `ragTopK` usa `parseInt`. Las keys tienen default `\"\"`, por eso `getRequiredEnvVar` nunca lanza con ellas; la validación real está en `validateConfig()` (exige `ANTHROPIC_API_KEY`, avisa si falta `OPENAI_API_KEY`). Ya no existen `MODEL_PROVIDER` ni `OPENAI_MODEL`. |\n\n### `src/interface.ts`\n\n| | |\n|---|---|\n| **Propósito** | Interfaces compartidas: `Message`, `ToolDefinition`, `Chunk`, `Retri
